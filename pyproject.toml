[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-generative-recommendation"
version = "0.1.0"
description = "Experimental, auditable agentic generative recommender (Planner + TIGER/E5 + RRF + constraints + reranker + LLM judgment + LangGraph controller)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Agentic Generative Recommendation contributors" }]


# Core runtime dependencies are intentionally small. Heavy model dependencies live
# in the optional extras so that the data contracts can be installed and tested
# without pulling torch/faiss.
dependencies = [
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.4,<3",
  "PyYAML>=6.0.1,<7",
  "numpy>=1.26,<3",
  "httpx>=0.27,<1",
  "tenacity>=8.3,<10",
]

[project.urls]
Homepage = "https://github.com/Bowen-mantou/agentic-generative-recommendation"
Repository = "https://github.com/Bowen-mantou/agentic-generative-recommendation"
Issues = "https://github.com/Bowen-mantou/agentic-generative-recommendation/issues"
[project.optional-dependencies]
# Phase 1 retrieval baseline: E5 encoder + FAISS index.
retrieval = [
  "torch>=2.2",
  "transformers>=4.44,<5",
  "sentence-transformers>=3.0,<6",
  "faiss-cpu>=1.8",
  "datasets>=2.20,<5",
  "huggingface-hub>=0.24,<2",
  "tqdm>=4.66,<5",
]
# Phase 5 workflow (LangGraph) — declared now, installed only when needed.
workflow = [
  "langgraph>=0.2,<2",
  "langchain-core>=0.3,<2",
]
# Phase 6 memory (Mem0 OSS + Qdrant).
memory = [
  "mem0ai>=0.1,<2",
  "qdrant-client>=1.9,<2",
]
dev = [
  "pytest>=8.2,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.5,<1",
  "mypy>=1.10,<2",
  "types-PyYAML>=6.0",
  "pre-commit>=3.7,<5",
]

[project.scripts]
agr = "recommender.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
recommender = ["py.typed"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
  "unit: fast tests with no external services",
  "integration: requires local models, indexes or services",
  "real_api: calls the real DeepSeek API (must be opted into explicitly)",
  "slow: long-running test",
]
filterwarnings = ["error::DeprecationWarning:recommender.*"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
  "RUF001", # ambiguous unicode punctuation (Chinese docstrings)
  "RUF002",
  "RUF003",
]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
files = ["src/recommender"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["yaml.*", "faiss.*", "sentence_transformers.*", "transformers.*", "datasets.*", "torch.*", "langgraph.*"]
ignore_missing_imports = true

# Base configuration: paths, logging and observability.
# All paths are relative to the project root unless they are absolute.
# Secrets are NEVER stored here; they come from environment variables (see .env.example).
schema_version: "1.0"

paths:
  data_dir: data
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed
  samples_dir: data/samples
  artifacts_dir: artifacts
  embeddings_dir: artifacts/embeddings
  faiss_dir: artifacts/faiss
  semantic_ids_dir: artifacts/semantic_ids
  catalog_dir: artifacts/catalog
  checkpoints_dir: artifacts/checkpoints
  runs_dir: runs

logging:
  level: INFO
  json_output: true
  include_context: true

observability:
  trace_enabled: true
  trace_sample_rate: 1.0

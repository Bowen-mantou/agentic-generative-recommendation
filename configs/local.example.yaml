# Machine-local overlay example (copy to configs/local.yaml, which is gitignored).
# Values here override configs/base.yaml, models.yaml, retrieval.yaml, controller.yaml
# and memory.yaml, in that order, before environment overrides are applied.
#
# Example server layout:
#   * raw data and model caches live outside the repository (mounted volume / NFS)
#   * model cache is redirected by scripts/env_s4000.sh (HF_HOME)
#   * E5 runs on CPU in this baseline; GPU acceleration is not wired into the encoder
paths:
  raw_dir: /mnt/agr-data/data/raw
  interim_dir: /mnt/agr-data/data/interim
  processed_dir: /mnt/agr-data/data/processed

e5:
  device: cpu

memory:
  sqlite:
    path: /mnt/agr-data/data/processed/interaction_history.db

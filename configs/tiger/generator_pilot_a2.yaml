# B2 generator config: matches RQ-VAE A2 (4 levels x 1024) so token vocab = 4096.
name: generator_pilot_a2
num_levels: 4
codebook_size: 1024
embedding_dim: 128
num_layers: 2
num_heads: 4
feedforward_dim: 256
dropout: 0.1
max_seq_len: 64
max_history_items: 10
epochs: 40
batch_size: 256
learning_rate: 0.001
weight_decay: 0.01
seed: 42
device: cpu
log_every_epochs: 5
beam_size: 10
top_k_products: 50

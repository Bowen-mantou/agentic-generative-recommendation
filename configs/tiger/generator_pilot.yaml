# Phase 4 autoregressive generator pilot (decoder-only Transformer, CPU per Q11).
# Trained from scratch on time-split All_Beauty sequences; no external weights.
name: generator_pilot_a1
num_levels: 3
codebook_size: 256
embedding_dim: 128
num_layers: 2
num_heads: 4
feedforward_dim: 256
dropout: 0.1
max_seq_len: 64
max_history_items: 10
epochs: 40
batch_size: 256
learning_rate: 0.001
weight_decay: 0.01
seed: 42
device: cpu
log_every_epochs: 5
beam_size: 10
top_k_products: 50
